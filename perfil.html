<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Gusticos - Mi Perfil</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="dashboard-page">
    <header class="dashboard-header">
        <div class="header-brand">
            <span class="material-icons">person</span>
            <span>Mi Perfil</span>
        </div>
        <div class="header-user">
            <button id="btn-volver-dashboard" class="btn-secondary">
                <span class="material-icons">arrow_back</span> Volver
            </button>
            <button id="btn-logout" class="btn-logout">
                <span class="material-icons">logout</span> Cerrar sesión
            </button>
        </div>
    </header>

    <main class="dashboard-main">
        <div id="mensaje-perfil" class="mensaje-feedback" style="display:none;"></div>

        <!-- EDITAR DATOS PERSONALES -->
        <section class="profile-section">
            <h3><span class="material-icons">edit</span> Datos Personales</h3>
            <form id="form-editar-perfil">
                <div class="form-group">
                    <label for="perfil-identificacion">Documento</label>
                    <input type="text" id="perfil-identificacion" readonly class="input-readonly">
                </div>
                <div class="form-group">
                    <label for="perfil-usuario">Correo electrónico</label>
                    <input type="email" id="perfil-usuario" readonly class="input-readonly">
                </div>
                <div class="form-group">
                    <label for="perfil-nombre">Nombre completo</label>
                    <input type="text" id="perfil-nombre" required>
                </div>
                <div class="form-group">
                    <label for="perfil-celular">Celular</label>
                    <input type="tel" id="perfil-celular" required>
                </div>
                <button type="submit" class="btn-primary">
                    <span class="material-icons">save</span> Guardar cambios
                </button>
            </form>
        </section>

        <!-- CAMBIAR CONTRASEÑA -->
        <section class="profile-section">
            <h3><span class="material-icons">security</span> Cambiar Contraseña</h3>
            <form id="form-cambiar-password">
                <div class="form-group">
                    <label for="password-actual">Contraseña actual</label>
                    <input type="password" id="password-actual" required>
                </div>
                <div class="form-group">
                    <label for="password-nueva">Nueva contraseña</label>
                    <input type="password" id="password-nueva" minlength="8" required>
                    <small>Mínimo 8 caracteres</small>
                </div>
                <div class="form-group">
                    <label for="password-confirm">Confirmar nueva contraseña</label>
                    <input type="password" id="password-confirm" minlength="8" required>
                </div>
                <button type="submit" class="btn-primary">
                    <span class="material-icons">lock_reset</span> Cambiar contraseña
                </button>
            </form>
        </section>
    </main>

    <script src="js/models/Cliente.js"></script>
    <script src="js/models/Cuenta.js"></script>
    <script src="js/models/CuentaAhorros.js"></script>
    <script src="js/models/CuentaCorriente.js"></script>
    <script src="js/models/TarjetaCredito.js"></script>
    <script src="js/services/StorageService.js"></script>
    <script src="js/services/AuthService.js"></script>
    <script src="js/controllers/ProfileController.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
